name: Build vendor blobs

# Put this file in the VENDOR repository (android_vendor_infinix_X6528) at
# .github/workflows/build-vendor.yml on its default branch.
# It reads the device tree from its own repo, extracts the blobs from your dump,
# and commits the result directly to this repository. No personal token needed.

on:
  workflow_dispatch:
    inputs:
      dump_url:
        description: "Direct link to the dump (zip/7z/tar archive containing super.img or partition images)"
        required: true
      device_repo:
        description: "Device tree repository (owner/name)"
        default: SPEEDFIRE7/android_device_infinix_X6528
      device_branch:
        description: "Device tree branch"
        default: lineage-20
      target_branch:
        description: "Branch of THIS repository that receives the blobs"
        default: lineage-20

permissions:
  contents: write

jobs:
  vendor:
    runs-on: namespace-profile-speed   # change to your Namespace runner label if you prefer
    timeout-minutes: 240
    env:
      DUMP_URL: ${{ inputs.dump_url }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repo }}
          ref: ${{ inputs.device_branch }}
          path: work/device/infinix/X6528

      - name: Checkout this vendor repository
        uses: actions/checkout@v4
        with:
          path: vendor_repo
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils android-sdk-libsparse-utils p7zip-full \
            patchelf python3-pip lz4 unzip file rsync git
          pip install gdown --break-system-packages

      - name: Download dump
        run: |
          mkdir -p dl && cd dl
          if [[ "$DUMP_URL" == *drive.google.com* ]]; then
            gdown --fuzzy "$DUMP_URL" -O dump.bin
          else
            curl -fL --retry 3 -o dump.bin "$DUMP_URL"
          fi
          ls -lh dump.bin
          file dump.bin

      - name: Locate images
        run: |
          mkdir -p raw
          if 7z x -y dl/dump.bin -oraw >/dev/null 2>&1; then
            echo "Archive extracted"
            rm -f dl/dump.bin
          else
            echo "Not an archive, treating as a raw image"
            mv dl/dump.bin raw/super.img
          fi
          find raw -maxdepth 4 -type f -name '*.img' -exec ls -lh {} \;

      - name: Unpack super.img and extract partitions
        run: |
          set -eo pipefail
          mkdir -p dump lp
          SUPER=$(find raw -type f -name 'super.img' | head -n1 || true)

          extract_img() {
            local img="$1" name="$2" dst="$GITHUB_WORKSPACE/dump/$2"
            mkdir -p "$dst"
            if fsck.erofs --extract="$dst" "$img" >/dev/null 2>&1; then
              echo "[$name] erofs extracted"
            else
              mkdir -p /tmp/mnt
              sudo mount -o loop,ro "$img" /tmp/mnt
              sudo cp -a /tmp/mnt/. "$dst"/
              sudo umount /tmp/mnt
              sudo chown -R "$USER" "$dst"
              echo "[$name] ext4 extracted"
            fi
            rm -f "$img"
          }

          if [ -n "$SUPER" ]; then
            if file "$SUPER" | grep -qi "sparse"; then
              simg2img "$SUPER" super.raw
              rm -f "$SUPER"
            else
              mv "$SUPER" super.raw
            fi
            git clone --depth 1 https://github.com/unix3dgforce/lpunpack
            python3 lpunpack/lpunpack.py super.raw lp
            rm -f super.raw
            ls -lh lp
            for f in lp/*.img; do
              n=$(basename "$f" .img)
              case "$n" in *_b|*-cow*) rm -f "$f"; continue;; esac
              extract_img "$f" "${n%_a}" || echo "::warning::could not extract $n"
            done
          else
            echo "No super.img found, looking for partition images (name_a.img / name.img)"
            FOUND=0
            while IFS= read -r f; do
              n=$(basename "$f" .img)
              case "$n" in *_b|*-cow*) continue;; esac
              case "${n%_a}" in
                system|system_ext|product|vendor|odm|vendor_dlkm|odm_dlkm|system_dlkm)
                  if file "$f" | grep -qi sparse; then simg2img "$f" "$f.raw" && mv "$f.raw" "$f"; fi
                  extract_img "$f" "${n%_a}"
                  FOUND=1;;
              esac
            done < <(find raw -type f -name '*.img')
            [ "$FOUND" = 1 ] || { echo "No partition images found"; exit 1; }
          fi
          ls dump
          df -h /

      - name: Prepare LineageOS extract tools
        run: |
          git clone --depth 1 -b lineage-20.0 https://github.com/LineageOS/android_vendor_lineage work/vendor/lineage
          git clone --depth 1 -b lineage-20.0 https://github.com/LineageOS/android_tools_extract-utils work/tools/extract-utils
          for d in prebuilts/tools-lineage prebuilts/extract-tools; do
            mkdir -p "work/$d/linux-x86/bin"
            ln -sf "$(which patchelf)" "work/$d/linux-x86/bin/patchelf"
          done

      - name: Extract blobs and generate vendor makefiles
        working-directory: work/device/infinix/X6528
        run: |
          chmod +x extract-files.sh setup-makefiles.sh
          ./extract-files.sh "$GITHUB_WORKSPACE/dump"

      - name: Verify result
        run: |
          V=work/vendor/infinix/X6528
          test -d "$V/proprietary" || { echo "vendor tree is empty"; exit 1; }
          find "$V" -type f | wc -l
          du -sh "$V"
          find "$V" -type f -size +95M -printf '%P\n' | tee big-files.txt
          [ ! -s big-files.txt ] || echo "::warning::Files above 95 MB cannot be pushed to GitHub and are skipped (see the artifact)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinix-X6528-vendor
          path: work/vendor/infinix/X6528
          compression-level: 6

      - name: Commit blobs to this repository
        run: |
          cd vendor_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" FETCH_HEAD
          else
            git checkout --orphan "$TARGET_BRANCH"
            git rm -rf -q . || true
          fi

          # replace everything except .git and the workflow folder
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude-from="$GITHUB_WORKSPACE/big-files.txt" "$GITHUB_WORKSPACE/work/vendor/infinix/X6528/" ./

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -q -m "Update Infinix X6528 vendor blobs from dump"
            git push origin "$TARGET_BRANCH"
          fi
