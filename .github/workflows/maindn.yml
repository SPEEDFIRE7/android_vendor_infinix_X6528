name: Upload Vendor Blobs to Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0)'
        required: true
        default: 'vendor-blobs'
      release_name:
        description: 'Release name'
        required: true
        default: 'Vendor Blobs - Infinix X6528'

jobs:
  upload-vendor:
    runs-on: namespace-profile-speed
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact from workflow run
        uses: actions/download-artifact@v4
        with:
          name: infinix-X6528-vendor
          run-id: 44161760331
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SPEEDFIRE7/android_vendor_infinix_X6528
          path: vendor_output

      - name: List downloaded files
        run: |
          echo "=== Content ==="
          ls -lh vendor_output/
          echo "=== Total size ==="
          du -sh vendor_output/

      - name: Install pigz for fast parallel compression
        run: sudo apt-get install -y pigz

      - name: Pack vendor with pigz
        run: |
          cd vendor_output
          echo "Packing with pigz (parallel gzip)..."
          tar -I pigz -cf ../vendor_blobs.tar.gz .
          ls -lh ../vendor_blobs.tar.gz

      - name: Split if larger than 2GB
        id: prepare
        run: |
          SIZE=$(stat -c%s vendor_blobs.tar.gz)
          MAX=$((2000 * 1024 * 1024))
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "Splitting into 2GB parts..."
            split -b 2000m vendor_blobs.tar.gz vendor_blobs.tar.gz.part_
            rm vendor_blobs.tar.gz
          fi
          echo "=== Files to upload ==="
          ls -lh vendor_blobs* 2>/dev/null || ls -lh vendor_blobs.tar.gz.part_* 2>/dev/null
          TOTAL=$(du -sh vendor_output/ | cut -f1)
          echo "total_size=$TOTAL" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag }}
          release_name: ${{ github.event.inputs.release_name }}
          body: |
            ## Vendor Blobs — Infinix Hot 40i (X6528)

            - **Chipset**: Unisoc T606
            - **Size**: ${{ steps.prepare.outputs.total_size }}
            - **Source**: Extracted from device dump
            - **Build**: Generated via IOSPTDGEN

            ### Usage
            Clone or extract to `vendor/infinix/X6528/` in your AOSP tree.

            > If split into parts, download all parts and run:
            > `cat vendor_blobs.tar.gz.part_* > vendor_blobs.tar.gz && tar xzf vendor_blobs.tar.gz`
          draft: false
          prerelease: false

      - name: Upload vendor files to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPLOAD_URL="${{ steps.create_release.outputs.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL%\{*}"

          for FILE in vendor_blobs*; do
            if [ -f "$FILE" ]; then
              echo "Uploading: $FILE ($(du -sh $FILE | cut -f1))"
              HTTP_CODE=$(curl -s -o /tmp/upload_response.json -w "%{http_code}" \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$FILE" \
                "${UPLOAD_URL}?name=${FILE}&label=${FILE}")
              if [ "$HTTP_CODE" -eq 201 ]; then
                echo "✓ Uploaded: $(jq -r '.browser_download_url' /tmp/upload_response.json)"
              else
                echo "✗ Failed ($HTTP_CODE): $(cat /tmp/upload_response.json)"
                exit 1
              fi
            fi
          done
