name: Upload Vendor Blobs to Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0)'
        required: true
        default: 'vendor-blobs'
      release_name:
        description: 'Release name'
        required: true
        default: 'Vendor Blobs - Infinix X6528'

jobs:
  upload-vendor:
    runs-on: namespace-profile-speed
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact from workflow run
        uses: actions/download-artifact@v4
        with:
          name: infinix-X6528-vendor
          run-id: 44161760331
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SPEEDFIRE7/android_vendor_infinix_X6528
          path: vendor_output

      - name: List downloaded files
        run: |
          ls -lh vendor_output/
          du -sh vendor_output/

      - name: Install pigz
        run: sudo apt-get install -y pigz

      - name: Pack vendor with pigz
        run: |
          cd vendor_output
          tar -I pigz -cf ../vendor_blobs.tar.gz .
          ls -lh ../vendor_blobs.tar.gz

      - name: Split if larger than 2GB
        run: |
          SIZE=$(stat -c%s vendor_blobs.tar.gz)
          MAX=$((2000 * 1024 * 1024))
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "Splitting into 2GB parts..."
            split -b 2000m vendor_blobs.tar.gz vendor_blobs.tar.gz.part_
            rm vendor_blobs.tar.gz
          fi
          ls -lh vendor_blobs*

      - name: Create GitHub Release
        run: |
          TOTAL=$(du -sh vendor_output/ | cut -f1)
          gh release create "${{ github.event.inputs.tag }}" \
            --title "${{ github.event.inputs.release_name }}" \
            --notes "## Vendor Blobs — Infinix Hot 40i (X6528)

          - **Chipset**: Unisoc T606
          - **Size**: ${TOTAL}
          - **Source**: Extracted from device dump
          - **Build**: Generated via IOSPTDGEN

          ### Usage
          Extract to \`vendor/infinix/X6528/\` in your AOSP tree.

          > If split into parts:
          > \`cat vendor_blobs.tar.gz.part_* > vendor_blobs.tar.gz && tar xzf vendor_blobs.tar.gz\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload vendor files to release
        run: |
          for FILE in vendor_blobs*; do
            if [ -f "$FILE" ]; then
              echo "Uploading: $FILE ($(du -sh $FILE | cut -f1))"
              gh release upload "${{ github.event.inputs.tag }}" "$FILE" --clobber
              echo "✓ Done: $FILE"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
