name: Upload Vendor Blobs to Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0)'
        required: true
        default: 'vendor-blobs'
      release_name:
        description: 'Release name'
        required: true
        default: 'Vendor Blobs - Infinix X6528'

jobs:
  upload-vendor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact from workflow run
        uses: actions/download-artifact@v4
        with:
          name: vendor
          run-id: 44161760331
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SPEEDFIRE7/android_vendor_infinix_X6528
          path: vendor_output

      - name: List downloaded files
        run: ls -lh vendor_output/

      - name: Get artifact size
        id: size
        run: |
          SIZE=$(du -sh vendor_output/ | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Split vendor archive if needed
        id: split
        run: |
          cd vendor_output
          FILE=$(ls *.tar.gz *.zip *.tar 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "No archive found, creating one..."
            tar -czf vendor_blobs.tar.gz ./*
            FILE="vendor_blobs.tar.gz"
          fi
          SIZE_BYTES=$(stat -c%s "$FILE")
          MAX_BYTES=$((2000 * 1024 * 1024))
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "File too large, splitting..."
            split -b 2000m "$FILE" "${FILE}.part_"
            rm "$FILE"
            echo "split=true" >> $GITHUB_OUTPUT
          else
            echo "split=false" >> $GITHUB_OUTPUT
          fi
          ls -lh

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag }}
          release_name: ${{ github.event.inputs.release_name }}
          body: |
            ## Vendor Blobs — Infinix Hot 40i (X6528)

            - **Chipset**: Unisoc T606
            - **Size**: ${{ steps.size.outputs.size }}
            - **Source**: Extracted from device dump
            - **Build**: Generated via IOSPTDGEN

            ### Usage
            Extract to `vendor/infinix/X6528/` in your AOSP tree.

            > If split into parts, download all parts and run:
            > `cat vendor_blobs.tar.gz.part_* > vendor_blobs.tar.gz && tar xzf vendor_blobs.tar.gz`
          draft: false
          prerelease: false

      - name: Upload vendor files to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd vendor_output
          RELEASE_ID=${{ steps.create_release.outputs.id }}
          UPLOAD_URL=${{ steps.create_release.outputs.upload_url }}
          UPLOAD_URL="${UPLOAD_URL%\{*}"

          for FILE in *; do
            if [ -f "$FILE" ]; then
              echo "Uploading $FILE..."
              MIME="application/octet-stream"
              curl -s \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: $MIME" \
                --data-binary @"$FILE" \
                "${UPLOAD_URL}?name=${FILE}&label=${FILE}" \
                | jq -r '.browser_download_url // "Upload failed"'
            fi
          done
